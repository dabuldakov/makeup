spring:
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    # 0, а не 1: V1 — актуальная схема, её нельзя пропускать.
    baseline-version: 0
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET}

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://90.188.89.63:8085}
  cache:
    redis:
      # Несколько нод должны видеть общий кеш; отключается APP_CACHE_REDIS_ENABLED=false.
      enabled: ${APP_CACHE_REDIS_ENABLED:true}

server:
  error:
    include-message: never
    include-binding-errors: never

minio:
  url: ${MINIO_URL}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  externalUrl: ${MINIO_EXTERNAL_URL}

logging:
  level:
    com.example.makeup: INFO