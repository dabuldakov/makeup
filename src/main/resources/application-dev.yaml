spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/makeup
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Схему создаёт только Flyway. Hibernate не должен менять БД —
      # иначе появляется дрейф (мёртвые колонки, отсутствующие индексы).
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

jwt:
  secret: ${JWT_SECRET:dev-only-secret-key-change-me-1234567890-abcdef}

minio:
  url: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  externalUrl: http://localhost:9000

logging:
  level:
    com.example.videostreaming: DEBUG
    org.springframework.security: DEBUG