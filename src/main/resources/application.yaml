spring:
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 2000MB
      max-request-size: 2000MB
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      max-lifetime: 1800000
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

jwt:
  expiration: 43200000000

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:*}

server:
  port: 8080
  tomcat:
    threads:
      max: 100
      min-spare: 10
    accept-count: 200
  error:
    include-message: always
    include-binding-errors: always

minio:
  bucket: videos
  thumbnail-bucket: thumbnails
  news-image: news-image