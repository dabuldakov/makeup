# Балансировщик для нескольких реплик app. Docker DNS отдаёт все IP сервиса
# `app`, nginx распределяет запросы между ними (round-robin).
upstream makeup_app {
    server app:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Видео до 2 ГБ (совпадает с spring.servlet.multipart.max-file-size).
    client_max_body_size 2048m;

    location / {
        proxy_pass http://makeup_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Большие загрузки/стриминг: не буферизуем тело и не режем по таймауту.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
