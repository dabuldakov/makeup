services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    env_file:
      - .env
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - makeup-network

  # MinIO вынесен в отдельный проект shared-minio (см. репозиторий shared-minio);
  # app подключается к нему через внешнюю сеть shared-minio.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - makeup-network

  app:
    build: .
    restart: unless-stopped
    # Порт не публикуется наружу: масштабируем за nginx.
    # Число реплик: `APP_REPLICAS=3` в .env или `docker compose up --scale app=3`.
    deploy:
      replicas: ${APP_REPLICAS:-1}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_URL: ${POSTGRES_URL}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
      MINIO_URL: ${MINIO_URL}
      MINIO_EXTERNAL_URL: ${MINIO_EXTERNAL_URL}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      APP_CACHE_REDIS_ENABLED: "true"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    networks:
      # Уникальный алиас — на общей сети есть app от chat с тем же именем `app`.
      makeup-network:
        aliases:
          - makeup-app
      # Общий MinIO живёт в этой сети (отдельный проект shared-minio).
      shared-minio:
    extra_hosts:
      - "90.188.89.63:host-gateway"

  # Балансировщик: внешний порт остаётся 8085, внутри — на все реплики app.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      # Монтируем каталог, а не файл: bind-mount файла держит inode, и замена
      # файла (sed -i / git reset) не видна контейнеру до пересоздания.
      - ./deploy:/etc/nginx/conf.d:ro
    depends_on:
      - app
    networks:
      - makeup-network

networks:
  makeup-network:
    driver: bridge
  # Нейтральная сеть для общего объектного хранилища. Создаётся один раз на
  # хосте (deploy это делает) и разделяется с chat без алиасов-коллизий.
  shared-minio:
    external: true
    name: shared-minio

volumes:
  postgres_data:
